<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPI Guard Chat｜受領文書チェック</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <h1>受領文書チェック</h1>
    <p class="bar-sub"><span class="lock" aria-hidden="true"></span>ファイルはこのPCの外に出ません</p>
  </div>
</header>

<main id="log" class="log" aria-live="polite"></main>

<form id="composer" class="composer" autocomplete="off">
  <div class="composer-inner">
    <label class="attach" title="ファイルを添付">
      <input id="file" type="file" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M16.5 6.5v10a4.5 4.5 0 0 1-9 0V5a3 3 0 0 1 6 0v10.5a1.5 1.5 0 0 1-3 0V6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="sr">ファイルを添付</span>
    </label>
    <input id="q" class="q" type="text" placeholder="ファイルを添付するか、結果について質問できます" aria-label="メッセージ">
    <button class="send" type="submit">送信</button>
  </div>
</form>

<div id="drop" class="drop" hidden><p>ここにドロップして検査</p></div>
<script src="/app.js"></script>
</body>
</html>
